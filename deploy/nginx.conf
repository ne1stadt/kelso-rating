# /etc/nginx/sites-available/kelso — TLS termination + a small cache in front of the app
proxy_cache_path /var/cache/nginx/kelso levels=1:2 keys_zone=kelso:10m max_size=200m inactive=10m;

server {
    listen 443 ssl http2;
    server_name kelso.example.org;
    # ssl_certificate / ssl_certificate_key: e.g. from certbot

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /static/ {
        alias /srv/kelso/web/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8040;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # pages are immutable per build; the app sets Cache-Control (5 min pages, 30 s live JSON)
        proxy_cache kelso;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
    }
}
